<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Škola">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="notify.js?v=2" defer></script>
<style>html:not(.unlocked) header.bar,html:not(.unlocked) #app,html:not(.unlocked) #tabbar{display:none!important}</style>
<title>Škola ESF</title>
<style>
/* Škola · iOS-like vzhled (stejný jazyk jako Pipeline): systémové písmo, seskupené seznamy, rozmazaná lišta, segmentované ovladače. */
:root{
  --bg:#F2F2F7;--bg2:#FFFFFF;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.07);--tint:#007AFF;
  --ok:#1E7B38;--ok-bg:rgba(52,199,89,.17);--warn:#955800;--warn-bg:rgba(255,149,0,.17);--crit:#C4281C;--crit-bg:rgba(255,59,48,.12);--info:#0A5FCC;--info-bg:rgba(0,122,255,.11);
  --mark:#FF9500;--bar:rgba(242,242,247,.8);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -14px rgba(0,0,0,.22);
  --cl:.6;--cf:.4;--cx:14%;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--bg2:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.14);--tint:#0A84FF;
  --ok:#30D158;--ok-bg:rgba(48,209,88,.18);--warn:#FFB340;--warn-bg:rgba(255,159,10,.2);--crit:#FF6B62;--crit-bg:rgba(255,69,58,.2);--info:#64AEFF;--info-bg:rgba(10,132,255,.22);
  --mark:#FF9F0A;--bar:rgba(0,0,0,.72);--shadow:none;--cl:.72;--cf:.86;--cx:22%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--bg2:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.14);--tint:#0A84FF;
  --ok:#30D158;--ok-bg:rgba(48,209,88,.18);--warn:#FFB340;--warn-bg:rgba(255,159,10,.2);--crit:#FF6B62;--crit-bg:rgba(255,69,58,.2);--info:#64AEFF;--info-bg:rgba(10,132,255,.22);
  --mark:#FF9F0A;--bar:rgba(0,0,0,.72);--shadow:none;--cl:.72;--cf:.86;--cx:22%;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:400 15px/1.45 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
a{color:inherit}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.wrap{max-width:1040px;margin:0 auto}
.mono{font-family:var(--fm);font-size:.86em;letter-spacing:0}
.muted{color:var(--label2)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}

/* barva předmětu */
[style*="--h"]{--c:oklch(var(--cl) .16 var(--h));--c-bg:color-mix(in oklab,var(--c) var(--cx),var(--bg2));--c-fg:oklch(var(--cf) .12 var(--h));--c-line:color-mix(in oklab,var(--c) 30%,var(--bg2))}
.sq{--s:52px;width:var(--s);height:var(--s);flex:none;border-radius:22.4%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,oklch(.76 .14 var(--h)),oklch(.58 .19 var(--h)));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28),0 3px 8px -3px oklch(.5 .16 var(--h)/.55)}
.sq svg{width:62%;height:62%}

/* horní lišta */
.bar{position:sticky;top:0;z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1040px;margin:0 auto;height:48px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .sq{--s:28px}
.thm{margin-left:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--label2)}
.thm svg{width:18px;height:18px}
.nav{margin-left:auto;display:flex;gap:2px;background:var(--fill);padding:2px;border-radius:9px}
.nav button{border:0;background:none;padding:5px 16px;border-radius:7px;font-weight:500;font-size:13.5px;color:var(--label);display:flex;align-items:center;gap:6px}
.nav button[aria-current="page"]{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{background:#636366}}
.nav svg,.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav svg{display:none}
.tabbar{display:none}

/* nadpisy */
.lt{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:20px 2px 2px;text-wrap:balance}
.lt-sub{margin:0 2px 14px;color:var(--label2);font-size:15px}
.sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:26px 2px 10px}
.sh small{font-size:13px;font-weight:400;color:var(--label2);letter-spacing:-.005em}
h1,h2,h3{margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;letter-spacing:-.012em}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--tint);padding:14px 0 4px;font-size:16px;margin-left:-4px}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* upozornění */
.notices{display:grid;gap:8px;margin:6px 0 4px}
.notice{display:flex;gap:10px;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.4;align-items:flex-start;min-width:0}
.notice b{white-space:nowrap}
.notice.crit{background:var(--crit-bg);color:var(--crit)}.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice.info{background:var(--info-bg);color:var(--info)}
.notice div{min-width:0;color:var(--label)}
.notice.crit b,.notice.warn b,.notice.info b{color:inherit}
@media (max-width:640px){.notice{flex-direction:column;gap:2px}.notice b{white-space:normal}}

/* upozornění jako seznam */
.nrow{align-items:flex-start}
.nrow .nd{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--tint)}
.nrow .nd.crit{background:var(--crit)}.nrow .nd.warn{background:var(--mark)}
.nrow .rs{color:var(--label);font-size:14px;line-height:1.4;margin-top:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--bg2);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;text-align:left;border:0}
.kpi .kl{font-size:12.5px;color:var(--label2);font-weight:500}
.kpi .kv2{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12.5px;color:var(--label2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi .ring{position:absolute;right:12px;top:12px}
.kpi.hot .kv2{color:var(--crit)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* seskupené seznamy */
.group{background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:54px;position:relative;border:0;background:none;text-align:left;min-width:0}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.row .rb{min-width:0;flex:1}
.row .rt{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.012em;overflow-wrap:anywhere}
.row .rs{font-size:13px;color:var(--label2);margin-top:1px}
.row .rr{flex:none;font-size:13.5px;color:var(--label2);text-align:right;font-variant-numeric:tabular-nums}
.row .rr.hot{color:var(--crit);font-weight:600}
.row .cv{flex:none;width:8px;height:14px;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dbadge{flex:none;width:48px;text-align:center;border-radius:12px;background:var(--c-bg);color:var(--c-fg);padding:5px 0 4px;line-height:1}
.dbadge b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dbadge span{font-size:11px;font-weight:600;display:block;margin-top:2px}

/* dlaždice předmětů */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--bg2);border:0;border-radius:20px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0;transition:transform .12s}
.tile:active{transform:scale(.985)}
.tile .th{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile .sq{--s:56px}
.tile .pr{position:relative;display:grid;place-items:center;width:42px;height:42px}
.tile .pr .ring{position:absolute;inset:0}
.tile .pr b{font-size:10.5px;font-weight:700;color:var(--c-fg);font-variant-numeric:tabular-nums}
.tile .nm{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.tile .cd{color:var(--label2);font-size:12.5px;margin-top:2px}
.tile .nx{margin-top:auto;padding-top:9px;border-top:.5px solid var(--sep);font-size:13px;display:flex;gap:7px;align-items:flex-start;color:var(--label)}
.tile .nx i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:6px}
.tile .nx.none i{background:var(--label3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--fill);color:var(--label2);white-space:nowrap;line-height:1.5;text-decoration:none}
.chip.c{background:var(--c-bg);color:var(--c-fg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.crit{background:var(--crit-bg);color:var(--crit)}.chip.info{background:var(--info-bg);color:var(--info)}

/* stránka předmětu */
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 2px 4px}
.chead .sq{--s:72px}
.chead .ti{min-width:0;flex:1 1 240px}
.chead h1{font-size:clamp(26px,5vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.025em}
.chead .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:14px 0 0;background:var(--fill);border-radius:11px;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:7px 14px;white-space:nowrap;color:var(--label);font-weight:500;font-size:13.5px;border-radius:9px}
.tabs button[aria-selected="true"]{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:#636366}}
.tabs .n{font-size:11px;font-variant-numeric:tabular-nums;background:var(--fill);border-radius:99px;padding:0 6px;margin-left:5px;color:var(--label2)}
.panel{padding-top:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--bg2);border-radius:16px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0}
.kv dt{color:var(--label2);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.list li{padding-left:16px;position:relative;overflow-wrap:anywhere}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--tint))}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{background:var(--c-bg);color:var(--c-fg);border-radius:12px;padding:8px 13px;min-width:112px}
.stat b{display:block;font-size:21px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:.5px solid var(--sep);vertical-align:top}
th{font-size:12px;color:var(--label2);font-weight:600}
.scroll-x{overflow-x:auto}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.now td{background:color-mix(in oklab,var(--mark) 20%,transparent)}
tr.past td{color:var(--label2)}
.flag{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;background:var(--fill);color:var(--label2);margin-left:6px;vertical-align:middle}

/* termíny */
.dl{background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.dli{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:start;padding:12px 14px;position:relative}
.dli+.dli::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.dli.done .body,.dli.done .when{opacity:.5}
.dli.done .dtt{text-decoration:line-through}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border-radius:50%;border:1.6px solid var(--label3);background:transparent;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:var(--c,var(--tint));border-color:var(--c,var(--tint))}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.3px 2.3px 0;transform:translate(0,-1px) rotate(45deg)}
.dli .when{min-width:92px;font-variant-numeric:tabular-nums}
.dli .when b{display:block;font-size:15.5px;line-height:1.2;font-weight:600}
.dli .when span{font-size:12.5px;color:var(--label2)}
.dli .dtt{font-weight:600;line-height:1.3;letter-spacing:-.012em}
.dli .dnote{font-size:13.5px;color:var(--label2);margin-top:2px}
.dli .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.dli.urgent .when b{color:var(--crit)}
.dli.soon .when b{color:var(--warn)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{flex:none;border:0;background:var(--fill);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:500;color:var(--label)}
.fb[aria-pressed="true"]{background:var(--tint);color:#fff}
.fb.cc[aria-pressed="true"]{background:var(--c);color:#fff}
.empty{padding:20px;border-radius:16px;background:var(--fill2);color:var(--label2);text-align:center}

/* materiály */
.mg{margin-bottom:18px}
.mg h3{margin:0 2px 6px;font-size:15px}
.links{display:grid;gap:0;background:var(--bg2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.links a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:10px 14px;min-width:0;overflow-wrap:anywhere;font-size:14.5px;position:relative;color:var(--label)}
.links a+a::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.links a:active{background:var(--fill)}
.links a::after{content:"";flex:none;margin-left:auto;width:7px;height:7px;border:solid var(--label3);border-width:2px 2px 0 0;transform:rotate(45deg)}
.links a .ext{flex:none;font-family:var(--fm);font-size:10.5px;font-weight:600;color:var(--c-fg,var(--info));background:var(--c-bg,var(--info-bg));border-radius:6px;padding:1px 6px;text-transform:uppercase;min-width:38px;text-align:center}
.links a small{display:block;color:var(--label2);font-size:12.5px}
.links a>span:last-of-type{min-width:0}
@media (min-width:900px){.links.cols2{grid-template-columns:1fr 1fr}}

/* leaflety */
.lf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lf{text-align:left;background:var(--bg2);border:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:var(--shadow)}
.lf:active{transform:scale(.985)}
.lf .no{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--c);line-height:1}
.lf .tt{font-weight:600;line-height:1.25;font-size:15.5px}
.lf .bar2{height:5px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:2px}
.lf .bar2 i{display:block;height:100%;background:var(--c);border-radius:3px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}
.task{background:var(--bg2);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.task-h{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 10px}
.task-n{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--c-bg);color:var(--c-fg);font-variant-numeric:tabular-nums}
.task-t{min-width:0;flex:1;overflow-wrap:anywhere;padding-top:3px}
.task-t p{margin:0 0 6px}
.task-t ul{margin:6px 0 4px;padding-left:0;list-style:none;display:grid;gap:5px}
.task-t ul li{padding-left:28px;position:relative}
.task-t .rtx ul{list-style:disc;padding-left:20px;display:block;margin:6px 0}
.task-t .rtx ul li{padding-left:0}
.task-t ul li>b.pl{position:absolute;left:0;top:0;font-weight:600;color:var(--c-fg);font-size:.95em}
.mk{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:0 8px;margin-right:6px;vertical-align:middle;line-height:1.6}
.mk.b{background:var(--label);color:var(--bg2)}
.mk.f{background:var(--fill);color:var(--label2)}
.sol-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:.5px solid var(--sep);background:none;color:var(--tint);padding:11px 14px;font-size:15px;font-weight:500}
.sol-btn::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.sol-btn[aria-expanded="true"]::after{transform:rotate(-135deg) translate(-2px,-2px)}
.sol-btn:active{background:var(--fill)}
.sol{border-top:.5px solid var(--sep);background:var(--c-bg);padding:14px 14px 14px}
.sol p{margin:0 0 7px}

  var SH = [];                  // sdílené předměty v tomto zařízení: [{id, ts, added, b}]

  /* ---- příjem: z cizího vstupu přestavět čistou kopii ---- */
  function deep(v, d) {

  /* přidá (nebo aktualizuje) sdílený předmět v tomto zařízení */

    var ex = SH.filter(function (x) { return x.id === id; })[0];
    if (ex && ex.ts === b.ts) return Promise.resolve({ st: 'same', b: b });
    if (ex && ex.ts > b.ts) return Promise.resolve({ st: 'older', b: b });

<script type="text/plain" id="skola-main">
(function(){
'use strict';
var D = window.DATA;
var IS = D.isBase;
var NOW = new Date();
var $app = document.getElementById('app');
var st = {view:'home', course:null, tab:'prehled', leaflet:null, fcourse:'all', showPast:false, showClasses:false, onlyBasic:false, openSol:{}, kind:'all'};

/* ---------- storage (best effort) ---------- */
var store = {
  get:function(k,d){try{var v=localStorage.getItem('skola.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('skola.'+k,JSON.stringify(v))}catch(e){}}
};
var done = store.get('done',{});      // deadline id -> true
var seen = store.get('seen',{});      // leaflet task id -> true
var theme = store.get('theme','auto');

/* ---------- helpers ---------- */
var DAYS=['Ne','Po','Út','St','Čt','Pá','So'];
var MSHORT=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
var MONTHS=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function url(u){ if(!u) return ''; return /^https?:/.test(u)?u:IS+u }
function ext(u){var m=/\.([a-z0-9]{2,5})(?:$|\?)/i.exec(u||'');return m?m[1]:'web'}
function course(id){return D.courses.filter(function(c){return c.id===id})[0]}
function dt(d,tm){return new Date(d+'T'+(tm||'23:59')+':00')}

function daysTo(d,tm){var ms=dt(d,tm||'23:59')-NOW;return ms/864e5}
function rel(d,tm){var n=daysTo(d,tm);if(n<0)return 'proběhlo';if(n<1){var h=Math.round(n*24);return h<=1?'za hodinu':'za '+h+' h'}var k=Math.ceil(n);return k===1?'zítra':'za '+k+' '+(k<5?'dny':'dní')}
function icon(id){return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(D.icons[id]||'')+'</svg>'}
var CV='<svg class="cv" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>';
var BACK='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 3.5 6 10l6.5 6.5"/></svg>';
function ring(p,sz,col){
  sz=sz||44; var r=(sz-6)/2, c=2*Math.PI*r, m=sz/2;
  return '<svg class="ring" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" aria-hidden="true"><circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="5"/>'+(p>0.004?'<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="'+(col||'var(--tint)')+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*Math.min(1,p)).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+m+' '+m+')"/>':'')+'</svg>';
}
/* rich text: **bold**, `code`, ^{sup}, _{sub}, blank-line paragraphs, "- " lists */
function inl(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');
  return s;
}
function rt(s){
  if(s==null) return '';
  return String(s).split(/\n\s*\n/).map(function(b){
    var lines=b.split('\n');
    if(lines.every(function(l){return /^- /.test(l)})) return '<ul>'+lines.map(function(l){return '<li>'+inl(l.slice(2))+'</li>'}).join('')+'</ul>';
    if(/^GRAF:/.test(b)) return '<p class="graph">'+inl(b)+'</p>';
    return '<p>'+lines.map(inl).join('<br>')+'</p>';
  }).join('');
}

/* ---------- flatten deadlines ---------- */
function allDeadlines(){
  var out=[];
  D.courses.forEach(function(c){
    (c.deadlines||[]).forEach(function(x,i){ out.push(Object.assign({cid:c.id,key:c.id+'#'+(x.id||i),kind:x.k||'termin'},x)); });
    (c.plan||[]).forEach(function(x,i){ if(x.k==='lecture'||x.k==='seminar'||x.k==='block') out.push({cid:c.id,key:c.id+'~'+i,kind:'vyuka',d:x.d,tm:x.tm,t:(x.k==='lecture'?'Přednáška: ':'Výuka: ')+x.t,note:x.n,est:x.est,u:null}); });
  });
  out.sort(function(a,b){return dt(a.d,a.tm||'00:00')-dt(b.d,b.tm||'00:00')});
  return out;
}
var KIND={odevzdani:'Odevzdání',test:'Test',kvis:'KvIS',registrace:'Registrace',zkouska:'Zkouška',termin:'Termín',vyuka:'Výuka',obhajoba:'Obhajoba',konzultace:'Konzultace'};
function nextDl(cid){
  return allDeadlines().filter(function(x){return x.cid===cid&&x.kind!=='vyuka'&&!done[x.key]&&daysTo(x.d,x.tm)>=0})[0];
}
/* postup v leafletech: úlohy z hotových leafletů a kolik jich mám odškrtnutých („Rozumím postupu“) */
function prog(cid){
  var tot=0,sn=0,lh=0,ln=0;
  D.courses.forEach(function(c){
    if(cid&&c.id!==cid) return;
    (D.leaflets[c.id]||[]).forEach(function(l){
      ln++; if(l.status==='hotovo'&&(l.tasks||[]).length){ lh++; l.tasks.forEach(function(t){ tot++; if(seen[l.id+':'+t.n]) sn++; }); }
    });
  });
  return {tot:tot,seen:sn,p:tot?sn/tot:0,lh:lh,ln:ln};
}

var VER={key:['ok','✓ shoda s klíčem z leafletu'],calc:['info','✓ ověřeno výpočtem'],theory:['','teorie, vlastní formulace'],unver:['warn','neověřeno – zkontroluj'],keyx:['warn','částečně v souladu s klíčem']};

function leafletView(c,l){
  var tasks=(l.tasks||[]).filter(function(t){return !st.onlyBasic||t.m==='!'||(t.parts||[]).some(function(p){return p.m==='!'})});
  var h='<button class="back" data-leaflet="" style="padding-top:0">'+BACK+(c.leafletLabel||'Leaflety')+'</button>';
  h+='<h2 class="sh" style="margin-top:6px">'+esc(l.id)+' · '+esc(l.title)+'<small>'+esc(l.when||'')+'</small></h2>';
  h+='<div class="links" style="margin-bottom:8px">'+(l.links||[]).map(linkEl).join('')+'</div>';
  var hasM=(l.tasks||[]).some(function(t){return t.m||(t.parts||[]).some(function(p){return p.m})});
  if(!(l.tasks||[]).length){
    if(l.status==='oficialni') return h+'<div class="empty">Vyučující zveřejnil vlastní řešení. Otevři odkazy výše.</div>'+(l.note?'<p class="muted" style="font-size:13px">'+inl(l.note)+'</p>':'');
    return h+'<div class="empty">Řešení tohoto leafletu se připravují.</div>';
  }
  h+='<div class="toolbar">'+(hasM?'<button class="fb" data-basic aria-pressed="'+st.onlyBasic+'">Jen základní (!)</button>':'')+'<button class="fb" data-allsol="1">Zobrazit všechna řešení</button><button class="fb" data-allsol="0">Skrýt všechna řešení</button></div>';
  h+='<p class="muted" style="font-size:13.5px;margin:0 2px 12px">'+(hasM?'(!) = základní příklad, který může vyučující vyvolat k tabuli · © = zábavný. ':'')+'Řešení jsou schválně skrytá: nejdřív to zkus sám, pak porovnej.</p>';
  h+=tasks.map(function(t){return taskEl(l,t)}).join('');
  if(l.note) h+='<p class="muted" style="font-size:13px;margin:4px 2px">'+inl(l.note)+'</p>';
  return h;
}
function mk(m){return m==='!'?'<span class="mk b">(!) základní</span>':(m==='©'?'<span class="mk f">© zábavný</span>':'')}
function taskEl(l,t){
  var id=l.id+':'+t.n, open=!!st.openSol[id], hasCh=!!(D.charts&&D.charts[id]);
  var parts=(t.parts||[]).map(function(p){return '<li><b class="pl">('+esc(p.l)+')</b>'+(p.m?mk(p.m):'')+inl(p.t)+'</li>'}).join('');
  var sol='';
  if(open){
    sol=rt(t.sol||'')+((t.parts||[]).some(function(p){return p.sol})?'<ul>'+t.parts.filter(function(p){return p.sol}).map(function(p){return '<li><b>('+esc(p.l)+')</b> '+String(p.sol).split('\n').map(function(x){var h=inl(x);return /^GRAF:/.test(x)?'<em class="graph">'+h+'</em>':h}).join('<br>')+'</li>'}).join('')+'</ul>':'');
    if(hasCh){
      /* popis grafu slovy zůstává, ale schovaný pod skutečným grafem */
      sol=sol.replace(/<p class="graph">([\s\S]*?)<\/p>/g,'<details class="alt"><summary>Popis grafu slovy</summary><p class="graph">$1</p></details>').replace(/<em class="graph">([\s\S]*?)<\/em>/g,'<details class="alt"><summary>Popis grafu slovy</summary><em class="graph">$1</em></details>');
      sol+='<div class="charts" data-charts="'+esc(id)+'"></div>';
    }
    sol='<div class="sol">'+sol+
      '<div class="ver">'+(t.v?'<span class="chip '+VER[t.v][0]+'">'+VER[t.v][1]+'</span>':'')+(t.key?'<span class="chip">klíč: '+esc(t.key)+'</span>':'')+'</div>'+
      '<label class="rev"><input class="chk" type="checkbox" data-seen="'+esc(id)+'"'+(seen[id]?' checked':'')+'> Rozumím postupu</label></div>';
  }
  return '<div class="task"><div class="task-h"><span class="task-n">'+esc(t.n)+'</span><div class="task-t">'+(t.m?mk(t.m):'')+(t.t?(/\n/.test(t.t)?'<div class="rtx">'+rt(t.t)+'</div>':inl(t.t)):'')+(parts?'<ul>'+parts+'</ul>':'')+'</div></div>'+
    '<button class="sol-btn" data-sol="'+esc(id)+'" aria-expanded="'+open+'">'+(open?'Skrýt řešení':'Ukázat řešení')+'</button>'+sol+'</div>';
}

/* ---------- global deadlines ---------- */
function viewDeadlines(){
  var list=allDeadlines();
  if(st.kind!=='all') list=list.filter(function(x){return x.kind===st.kind});
  if(!st.showClasses) list=list.filter(function(x){return x.kind!=='vyuka'});
  if(st.fcourse!=='all') list=list.filter(function(x){return x.cid===st.fcourse});
  if(!st.showPast) list=list.filter(function(x){return daysTo(x.d,x.tm)>=0});
  var h='<h1 class="lt">Termíny</h1><p class="lt-sub">'+list.length+' položek · odškrtni si, co máš hotové</p>';
  h+='<div class="filters"><button class="fb" data-fc="all" aria-pressed="'+(st.fcourse==='all')+'">Všechny předměty</button>'+D.courses.map(function(c){return '<button class="fb cc" style="--h:'+c.hue+'" data-fc="'+c.id+'" aria-pressed="'+(st.fcourse===c.id)+'">'+esc(c.short)+'</button>'}).join('')+'</div>';
  h+='<div class="filters"><button class="fb" data-kind="all" aria-pressed="'+(st.kind==='all')+'">Vše</button>'+['odevzdani','test','kvis','registrace','zkouska','obhajoba'].map(function(k){return '<button class="fb" data-kind="'+k+'" aria-pressed="'+(st.kind===k)+'">'+KIND[k]+'</button>'}).join('')+
     '<button class="fb" data-toggle="showClasses" aria-pressed="'+st.showClasses+'">+ výuka</button><button class="fb" data-toggle="showPast" aria-pressed="'+st.showPast+'">+ proběhlé</button></div>';
  if(!list.length) return h+'<div class="empty">Nic tu není.</div>';
  var cur='';
  list.forEach(function(x){
    var d=dt(x.d,'12:00'), m=MONTHS[d.getMonth()]+' '+d.getFullYear();
    if(m!==cur){ if(cur) h+='</div>'; cur=m; h+='<h2 class="sh" style="font-size:17px;text-transform:capitalize;margin-top:20px">'+m+'</h2><div class="dl">'; }
    h+=dlItem(x,true);
  });
  return h+'</div>';
}

/* ---------- week ---------- */
function viewWeek(){
  var H0=8,H1=18,PX=56;
  var today=NOW.getDay(); // 1..5
  var days=['Po','Út','St','Čt','Pá'];
  var h='<h1 class="lt">Týden</h1><p class="lt-sub">'+esc(D.semester)+' · pravidelná výuka z IS (bloková výuka SYRP a konzultace tu nejsou)</p>';
  h+='<div class="scroll-x" style="margin:0 -16px;padding:0 16px 4px"><div class="wk"><div class="hd"></div>'+days.map(function(d,i){return '<div class="hd'+(today===i+1?' today':'')+'">'+d+'</div>'}).join('');
  var hr='<div class="hr" style="height:'+((H1-H0)*PX)+'px">';
  for(var k=H0;k<H1;k++) hr+='<span style="top:'+((k-H0)*PX)+'px">'+k+':00</span>';
  hr+='</div>';
  h+=hr;
  var anyC=false;
  for(var di=1;di<=5;di++){
    h+='<div class="dc" style="height:'+((H1-H0)*PX)+'px">';
    var bs=D.timetable.filter(function(b){return b.day===di}), lay=layoutDay(bs);
    bs.forEach(function(b,bi){
      var c=course(b.cid); if(!c) return;
      var f=b.from.split(':'), t=b.to.split(':'), ly=lay[bi];
      var top=((+f[0])+(+f[1])/60-H0)*PX, ht=((+t[0])+(+t[1])/60-(+f[0])-(+f[1])/60)*PX-2;
      var col=b.col||(ly?[ly.l,ly.r]:null), cf=!!(b.conflict||ly);
      if(cf) anyC=true;
      h+='<button class="blk'+(cf?' conflict':'')+'" data-course="'+c.id+'" style="--h:'+c.hue+';top:'+top+'px;height:'+ht+'px'+(col?';left:'+col[0]+'%;right:'+col[1]+'%':'')+'"><b>'+esc(c.short)+'</b>'+esc(b.kind)+' · '+esc(b.room)+'<br>'+esc(b.from)+'–'+esc(b.to)+(b.note?'<br>'+esc(b.note):'')+'</button>';
    });
    h+='</div>';
  }
  h+='</div></div>';
  if(anyC) h+='<p class="muted" style="font-size:13px;margin:12px 2px 0">Čárkovaně orámované bloky se v čase překrývají.</p>';
  return h;
}
/* překrývající se bloky bez ručně daných sloupců (třeba z přidaných sdílených předmětů) rozdělit vedle sebe */
function tmin(s){var p=String(s).split(':');return (+p[0])*60+(+p[1]||0)}
function layoutDay(bs){
  var out=bs.map(function(){return null}), idx=[], groups=[], cur=null;
  bs.forEach(function(b,i){ if(!b.col) idx.push(i) });
  idx.sort(function(a,b){return tmin(bs[a].from)-tmin(bs[b].from)});
  idx.forEach(function(i){
    var s=tmin(bs[i].from), e=tmin(bs[i].to);
    if(cur&&s<cur.end){ cur.m.push(i); cur.end=Math.max(cur.end,e); } else { cur={m:[i],end:e}; groups.push(cur); }
  });
  groups.forEach(function(g){
    if(g.m.length<2) return;
    var lanes=[], lane={};
    g.m.forEach(function(i){ var s=tmin(bs[i].from), k=0; while(lanes[k]>s) k++; lanes[k]=tmin(bs[i].to); lane[i]=k; });
    var n=lanes.length;
    g.m.forEach(function(i){ out[i]={l:lane[i]*100/n, r:(n-1-lane[i])*100/n}; });
  });
  return out;
}

/* ---------- render + events ---------- */
function mountCharts(){
  if(!window.SkolaChart) return;
  Array.prototype.forEach.call($app.querySelectorAll('[data-charts]'),function(el){
    ((D.charts||{})[el.getAttribute('data-charts')]||[]).forEach(function(sp){ window.SkolaChart.mount(el,sp); });
  });
}
function render(){
  viewNav();
  $app.innerHTML = st.view==='course'?viewCourse():st.view==='deadlines'?viewDeadlines():st.view==='week'?viewWeek():viewHome();
  mountCharts();
}
function go(v,opts){
  st.view=v; if(opts){for(var k in opts) st[k]=opts[k];}
  render(); window.scrollTo(0,0);
  try{ history.replaceState(null,'',v==='course'?'#'+st.course:'#'+v) }catch(e){}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-course],[data-tab],[data-leaflet],[data-sol],[data-allsol],[data-basic],[data-fc],[data-kind],[data-toggle],[data-share],[data-unshare]');
  if(!t) return;
  if(t.hasAttribute('data-share')){ if(window.SkolaShare) window.SkolaShare.copy(t.dataset.share); return; }
  if(t.hasAttribute('data-unshare')){
    if(t.dataset.armed){ if(window.SkolaShare) window.SkolaShare.remove(t.dataset.unshare); }
    else { t.dataset.armed='1'; t.textContent='Opravdu odebrat? Klepni znovu'; }
    return;
  }
  if(t.hasAttribute('data-go')){ if(t.dataset.go==='home') st.course=null; go(t.dataset.go,{leaflet:null}); return; }
  if(t.hasAttribute('data-course')){ var tab=t.dataset.tab||'prehled'; go('course',{course:t.dataset.course,tab:tab,leaflet:null}); return; }
  if(t.hasAttribute('data-tab')){ st.tab=t.dataset.tab; st.leaflet=null; render(); return; }
  if(t.hasAttribute('data-leaflet')){ st.leaflet=t.dataset.leaflet||null; render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute('data-sol')){ var id=t.dataset.sol; st.openSol[id]=!st.openSol[id]; render(); return; }
  if(t.hasAttribute('data-allsol')){ var L=(D.leaflets[st.course]||[]).filter(function(x){return x.id===st.leaflet})[0]; if(L){ var on=t.dataset.allsol==='1'; (L.tasks||[]).forEach(function(k){st.openSol[L.id+':'+k.n]=on}); } render(); return; }
  if(t.hasAttribute('data-basic')){ st.onlyBasic=!st.onlyBasic; render(); return; }
  if(t.hasAttribute('data-fc')){ st.fcourse=t.dataset.fc; render(); return; }
  if(t.hasAttribute('data-kind')){ st.kind=t.dataset.kind; render(); return; }
  if(t.hasAttribute('data-toggle')){ st[t.dataset.toggle]=!st[t.dataset.toggle]; render(); return; }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.done){ done[t.dataset.done]=t.checked; if(!t.checked) delete done[t.dataset.done]; store.set('done',done); render(); if(window.SkolaPush) window.SkolaPush.sync(); }
  if(t.dataset&&t.dataset.seen){ seen[t.dataset.seen]=t.checked; if(!t.checked) delete seen[t.dataset.seen]; store.set('seen',seen); }
});
document.getElementById('brand').addEventListener('click',function(){st.course=null;go('home',{leaflet:null})});
document.getElementById('thm').addEventListener('click',function(){
  theme=theme==='auto'?'light':(theme==='light'?'dark':'auto'); store.set('theme',theme); applyTheme();
});

function fromHash(){
  var h=(location.hash||'').replace('#','');
  if(!h){ st.view='home'; st.course=null; st.leaflet=null; return; }
  if(course(h)){ st.view='course'; st.course=h; st.tab='prehled'; st.leaflet=null; }
  else if(['deadlines','week'].indexOf(h)>=0){ st.view=h; }
}
window.addEventListener('hashchange',function(){ fromHash(); render(); window.scrollTo(0,0); });
applyTheme();
fromHash();
render();
/* offline režim (jen když je appka nasazená jako web s manifestem) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
